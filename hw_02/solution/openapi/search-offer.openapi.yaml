openapi: 3.0.3
info:
  title: Search & Offer Service API
  description: Поиск и ранжирование предложений (отели, рейсы, туры). Читает Catalog и Inventory.
  version: 1.0.0

servers:
  - url: https://search-offer.travel.internal/v1

tags:
  - name: search
  - name: offers

paths:
  /search:
    get:
      tags: [search]
      operationId: searchOffers
      summary: Поиск предложений
      parameters:
        - $ref: '#/components/parameters/OfferType'
        - name: destination
          in: query
          required: true
          schema:
            type: string
          description: Город, аэропорт или регион
        - name: check_in
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: check_out
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: adults
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: children
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, rating, popularity]
            default: popularity
        - name: min_price
          in: query
          schema:
            type: number
        - name: max_price
          in: query
          schema:
            type: number
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Для персонализации ранжирования
      responses:
        '200':
          description: Список предложений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /offers/{offerId}:
    get:
      tags: [offers]
      operationId: getOffer
      summary: Детали предложения для карточки
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - name: check_in
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: check_out
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: adults
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Детали предложения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDetails'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferType:
      name: type
      in: query
      required: true
      schema:
        type: string
        enum: [hotel, flight, tour]

  schemas:
    SearchResponse:
      type: object
      required: [items, total, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OfferSummary'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    OfferSummary:
      type: object
      required: [offer_id, property_id, type, name, price, currency, available]
      properties:
        offer_id:
          type: string
          format: uuid
        property_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [hotel, flight, tour]
        name:
          type: string
        rating:
          type: number
          format: float
        price:
          type: number
        currency:
          type: string
          example: RUB
        available:
          type: boolean
        thumbnail_url:
          type: string
          format: uri

    OfferDetails:
      allOf:
        - $ref: '#/components/schemas/OfferSummary'
        - type: object
          properties:
            rate_plan_id:
              type: string
              format: uuid
            cancellation_policy:
              type: string
            amenities:
              type: array
              items:
                type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Некорректные параметры
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Предложение не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
